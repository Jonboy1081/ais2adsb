version: '3.8'
services:
  ais2adsb:
   image: ghcr.io/jvde-github/ais2adsb:edge
   container_name: ais2adsb
   hostname: ais2adsb
   restart: unless-stopped
   environment:
      - SBS_TARGET_HOST=ip_address_of_VRS_instance
      - SBS_TARGET_PORT=port_of_VRS_instance
      - INCLUDE_SAR=true       # forward SAR aircraft (default: on)
      - INCLUDE_SHIPS=true     # forward vessels (default: off)
      - CALLSIGN=true          # emit generated callsigns (default: on)
      # - METRICS_PORT=8080    # uncomment to expose /metrics and /health
   ports:
      - 9000:9000/udp          # if your NMEA UDP source uses a different port, change to xxxx:9000/udp
      # - 8080:8080            # uncomment alongside METRICS_PORT
   volumes:
      - /opt/ais/ais2adsb:/data
