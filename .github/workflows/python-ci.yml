name: Python CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: pip install aiscat
      - name: Compile-check
        run: python -m py_compile ais2adsb.py
      - name: Unit tests
        run: python -m unittest discover -v tests
